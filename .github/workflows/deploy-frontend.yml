name: Deploy Frontend to Production

on:
  push:
    branches:
      - master

jobs:
  deploy-frontend:
    runs-on: self-hosted
    env:
      ENVIRONMENT: production
      STACK_NAME: frontend-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine deployment directory
        run: |
          # Try to use /opt/front first, fallback to home directory
          if mkdir -p /opt/front 2>/dev/null; then
            export DEPLOY_DIR="/opt/front"
            echo "✅ Using /opt/front as deployment directory"
          else
            export DEPLOY_DIR="$HOME/front"
            echo "⚠️  Cannot access /opt, using $HOME/front as deployment directory"
          fi
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> $GITHUB_ENV

      - name: Create deployment structure
        run: |
          echo "📁 Creating deployment directory structure..."
          mkdir -p $DEPLOY_DIR/current
          mkdir -p $DEPLOY_DIR/releases
          echo "✅ Deployment structure created"

      - name: Backup current deployment if exists
        run: |
          cd $DEPLOY_DIR

          # Check if current deployment exists and is not empty
          if [ -d "current" ] && [ "$(ls -A current 2>/dev/null)" ]; then
            echo "📦 Backing up current deployment to releases..."
            
            # Create timestamp for backup
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            BACKUP_DIR="releases/backup_$TIMESTAMP"
            
            # Create backup directory
            mkdir -p "$BACKUP_DIR"
            
            # Copy current deployment to backup (excluding .env)
            echo "📋 Copying current deployment to backup..."
            rsync -av --exclude='.env' current/ "$BACKUP_DIR/"
            
            # Copy .env separately to preserve it
            if [ -f "current/.env" ]; then
              cp current/.env "$BACKUP_DIR/"
              echo "✅ .env file backed up"
            fi
            
            echo "✅ Current deployment backed up to $BACKUP_DIR"
          else
            echo "ℹ️  No current deployment found, skipping backup"
          fi

      - name: Create new release directory
        run: |
          cd $DEPLOY_DIR

          # Create timestamp for new release
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          RELEASE_DIR="releases/release_$TIMESTAMP"

          mkdir -p "$RELEASE_DIR"
          echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV
          echo "✅ New release directory created: $RELEASE_DIR"

      - name: Copy project to new release directory
        run: |
          cd $DEPLOY_DIR
          echo "📋 Copying project files to $RELEASE_DIR..."
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='.venv' --exclude='current' --exclude='releases' $GITHUB_WORKSPACE/ $RELEASE_DIR/
          echo "✅ Project copied to $RELEASE_DIR"

          # Ensure proper ownership for deployment
          echo "🔧 Setting proper ownership..."
          chown -R $(id -u):$(id -g) "$RELEASE_DIR"
          echo "✅ Ownership set correctly"

      - name: Copy .env file to release directory
        run: |
          cd $DEPLOY_DIR

          # Check if .env exists in root directory
          if [ -f ".env" ]; then
            echo "📋 Copying .env file to release directory..."
            cp .env "$RELEASE_DIR/"
            echo "✅ .env file copied to $RELEASE_DIR"
          else
            echo "⚠️  .env file not found in $DEPLOY_DIR, creating default one..."
            echo "VITE_FRONTEND_PORT=5195" > "$RELEASE_DIR/.env"
            echo "VITE_API_URL=http://localhost:8000/api" >> "$RELEASE_DIR/.env"
            echo "✅ Default .env file created in $RELEASE_DIR"
          fi

      - name: Verify .env file exists in release directory
        run: |
          cd $DEPLOY_DIR
          if [ ! -f "$RELEASE_DIR/.env" ]; then
            echo "❌ Error: .env file not found in $RELEASE_DIR"
            exit 1
          fi
          echo "✅ .env file found in $RELEASE_DIR"

      - name: Stop current services
        run: |
          cd $DEPLOY_DIR
          if [ -d "current" ] && [ -f "current/docker-compose.yml" ]; then
            echo "🛑 Stopping current services..."
            cd current
            # Stop with both possible project names to ensure cleanup
            docker compose -f docker-compose.yml --project-name frontend-production down --volumes --remove-orphans || true
            docker compose -f docker-compose.yml down --volumes --remove-orphans || true
            cd ..
            echo "✅ Current services stopped"
          else
            echo "ℹ️  No current services to stop"
          fi

          # Additional cleanup: kill any processes using port 5195
          echo "🧹 Cleaning up port 5195..."
          docker ps -q --filter "publish=5195" | xargs -r docker kill || true
          docker ps -aq --filter "publish=5195" | xargs -r docker rm || true
          echo "✅ Port 5195 cleaned up"

      - name: Clean up current directory
        run: |
          cd $DEPLOY_DIR

          # Use Docker to clean up files as root, then change ownership
          echo "🧹 Cleaning up current directory..."
          if [ -d "current" ]; then
            echo "🔧 Using Docker to clean up files..."
            # Use alpine container to remove files as root
            docker run --rm -v "$(pwd)/current:/cleanup" alpine:latest sh -c "
              rm -rf /cleanup/*
              chown -R 1000:1000 /cleanup
            " || true
            echo "✅ Current directory cleaned up"
          fi

      - name: Deploy new release
        run: |
          cd $DEPLOY_DIR

          # Copy new release to current
          echo "📋 Deploying new release to current..."
          rsync -av --exclude='current' --exclude='backups' --exclude='releases' "$RELEASE_DIR/" current/

          # Ensure all files have correct ownership
          echo "🔧 Fixing file ownership..."
          chown -R 1000:1000 current/
          echo "✅ File ownership fixed"

          # Build and start services
          echo "🔨 Building Docker images..."
          cd current
          # Load environment variables from .env file for build
          if [ -f ".env" ]; then
            export $(cat .env | grep -v '^#' | xargs)
            echo "✅ Environment variables loaded from .env"
          fi
          docker compose -f docker-compose.yml --project-name frontend-production build

          echo "🚀 Starting services..."
          docker compose -f docker-compose.yml --project-name frontend-production up -d

          echo "✅ New release deployed successfully"

          echo "📊 Checking service status..."
          docker compose -f docker-compose.yml --project-name frontend-production ps

          echo "🔍 Health check..."
          sleep 30  # Wait for services to start
          if curl -f http://localhost:5195/health; then
            echo "✅ Health check passed - frontend is accessible"
          else
            echo "⚠️  Health check failed - check logs with: cd $DEPLOY_DIR/current && docker compose -f docker-compose.yml --project-name frontend-production logs"
          fi

      - name: Clean up old releases and backups
        run: |
          cd $DEPLOY_DIR
          echo "🧹 Cleaning up old releases and backups (keeping last 5 total)..."
          cd releases
          ls -t | tail -n +6 | xargs -r rm -rf
          cd ..
          echo "✅ Old releases and backups cleaned up"

      - name: Deployment summary
        run: |
          cd $DEPLOY_DIR
          echo ""
          echo "🎉 Frontend deployment completed successfully!"
          echo "📁 Current deployment: $DEPLOY_DIR/current"
          echo "📦 Latest release: $RELEASE_DIR"
          echo ""
          echo "📋 Available releases and backups:"
          ls -la releases/ 2>/dev/null || echo "No releases found"
          echo ""
          echo "🔄 To rollback to previous version:"
          echo "1. Stop current services: cd $DEPLOY_DIR/current && docker compose down"
          echo "2. Restore from backup: rsync -av $DEPLOY_DIR/releases/backup_YYYYMMDD_HHMMSS/ $DEPLOY_DIR/current/"
          echo "3. Start services: cd $DEPLOY_DIR/current && docker compose up -d"
