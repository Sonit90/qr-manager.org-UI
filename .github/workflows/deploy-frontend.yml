name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_LATEST=ghcr.io/${REPO_LC}:latest" >> $GITHUB_ENV
          echo "IMAGE_SHA=ghcr.io/${REPO_LC}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" \
            -t "${{ env.IMAGE_LATEST }}" \
            -t "${{ env.IMAGE_SHA }}" .

      - name: Push image
        run: |
          docker push "${{ env.IMAGE_LATEST }}"
          docker push "${{ env.IMAGE_SHA }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Production(Hetzner)

    steps:
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> $GITHUB_ENV

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}

          envs: IMAGE_NAME
          script: |
            REPO_DIR="$HOME/frontend"

            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone -b main https://github.com/${{ github.repository }} "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            printf "IMAGE_NAME=%s\nVITE_FRONTEND_PORT=%s\n" "${IMAGE_NAME}" "${{ secrets.VITE_FRONTEND_PORT }}" > .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
