name: Deploy

on:
  push:
    branches: ['main']

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_LATEST=ghcr.io/${REPO_LC}:latest" >> $GITHUB_ENV
          echo "IMAGE_SHA=ghcr.io/${REPO_LC}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Write build env
        env:
          BUILD_ENV_FILE: ${{ secrets.BUILD_ENV_FILE }}
        run: printf "${BUILD_ENV_FILE}" > .env.production

      - name: Build image
        run: |
          docker build \
            -t "${{ env.IMAGE_LATEST }}" \
            -t "${{ env.IMAGE_SHA }}" .

      - name: Push image
        run: |
          docker push "${{ env.IMAGE_LATEST }}"
          docker push "${{ env.IMAGE_SHA }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Production(Hetzner)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> $GITHUB_ENV

      - name: Write .env
        run: |
          printf "IMAGE_NAME=%s\nVITE_FRONTEND_PORT=%s\n" \
            "${{ env.IMAGE_NAME }}" \
            "${{ secrets.VITE_FRONTEND_PORT }}" > .env

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.yml,.env'
          target: 'frontend'

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd "$HOME/frontend"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
